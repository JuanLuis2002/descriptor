<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Descriptor de Puesto</title>
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <style>
        :root {
            --brand-blue: #04a7df;
            --brand-blue-dark: #007db6;
            --panel-bg: rgba(244, 244, 244, 0.92);
            --text-main: #4a4a4a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.03)),
                url('logo/logo2.jpg') center center / cover no-repeat fixed;
            color: var(--text-main);
        }

        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-panel {
            width: min(100%, 520px);
            background: var(--panel-bg);
            border-radius: 22px;
            padding: 34px 32px 28px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(3px);
            animation: fadeInUp 0.55s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-card {
            width: 160px;
            height: 160px;
            margin: 0 auto 28px;
            background: #fff;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            padding: 18px;
        }

        .logo-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .system-name {
            text-align: center;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: #333;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .login-title {
            text-align: center;
            font-weight: 700;
            font-size: clamp(1.8rem, 4vw, 2.25rem);
            margin-bottom: 22px;
            color: #4b4b4b;
        }

        .login-input {
            border: none;
            border-radius: 18px;
            min-height: 46px;
            padding: 10px 18px;
            color: #444;
            box-shadow: none;
        }

        .login-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(4, 167, 223, 0.18);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .login-input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #777;
            padding: 4px;
        }

        .btn-login {
            width: min(100%, 360px);
            min-height: 52px;
            border: none;
            border-radius: 18px;
            background: var(--brand-blue);
            color: #15364a;
            font-weight: 700;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .btn-login:hover {
            background: var(--brand-blue-dark);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 125, 182, 0.28);
        }

        .forgot-link {
            color: #1d5f9f;
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .login-shell {
                padding: 16px;
            }

            .login-panel {
                padding: 26px 20px 24px;
                border-radius: 18px;
            }

            .logo-card {
                width: 132px;
                height: 132px;
                margin-bottom: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="login-panel">
            <div class="logo-card">
                <img src="logo/logo.png" alt="Universidad Evangélica de El Salvador">
            </div>

            <div class="system-name">Sistema de Gestión Universitaria UEES</div>
            <h1 class="login-title">Iniciar Sesión</h1>

            <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                    <input type="text" class="form-control login-input" id="username" placeholder="Usuario" required>
                </div>

                <div class="mb-4 password-wrap">
                    <input type="password" class="form-control login-input" id="password" placeholder="Contraseña" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-login">Ingresar</button>
                </div>

                <div class="text-center mt-3">
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </main>

    <script src="assets/vendor/jquery/jquery-3.6.0.min.js"></script>
    <script src="assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script>
        const users = {
            'juan.hercules': { nombre: 'Ing. Juan Hércules', password: '123456', rol: 'JEFE_INMEDIATO', rolNombre: 'Jefe Inmediato', area: 'Subgerencia TI' },
            'roberto.cortez': { nombre: 'Dr. Roberto Cortez', password: '123456', rol: 'JEFE_SUPERIOR', rolNombre: 'Jefe Superior', area: 'Gerencia General' },
            'ana.lopez': { nombre: 'Licda. Ana López', password: '123456', rol: 'TH_GENERALISTA', rolNombre: 'TH Generalista', area: 'Talento Humano' },
            'carlos.gomez': { nombre: 'Lic. Carlos Gómez', password: '123456', rol: 'JEFE_TH', rolNombre: 'Jefe de TH', area: 'Talento Humano' },
            'juan.perez': { nombre: 'Ing. Juan Pérez', password: '123456', rol: 'COLABORADOR', rolNombre: 'Colaborador', area: 'Analista Programador' }
        };

        $('#togglePassword').click(function() {
            const passwordInput = $('#password');
            const icon = $(this).find('i');
            const isPassword = passwordInput.attr('type') === 'password';
            passwordInput.attr('type', isPassword ? 'text' : 'password');
            icon.toggleClass('fa-eye', !isPassword);
            icon.toggleClass('fa-eye-slash', isPassword);
        });

        $('#loginForm').submit(function(e) {
            e.preventDefault();
            const username = $('#username').val().toLowerCase().trim();
            const password = $('#password').val();
            
            if (users[username] && users[username].password === password) {
                sessionStorage.setItem('currentUser', JSON.stringify({ ...users[username], usuario: username }));
                window.location.href = 'index.html';
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de autenticación',
                    text: 'Usuario o contraseña incorrectos',
                    confirmButtonColor: '#0d6efd'
                });
            }
        });
    </script>
</body>
</html>
