<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Reportes de Descriptor</title>
  <style>
    :root {
      --blue: #0d6efd;
      --border: #d8dee9;
      --muted: #667085;
      --bg: #f3f6fb;
      --text: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .toolbar,
    .report-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.06);
    }

    .toolbar {
      padding: 18px;
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: #475467;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .report-card {
      padding: 22px;
      margin-bottom: 22px;
    }

    .report-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .report {
      background: #fff;
      color: #111827;
      border: 1px solid #cfd7e3;
      padding: 22px;
    }

    .report-header {
      border: 2px solid #111;
      display: grid;
      grid-template-columns: 150px 1fr 240px;
      align-items: center;
      margin-bottom: 12px;
    }

    .report-header > div {
      padding: 10px;
      min-height: 76px;
      border-right: 1px solid #111;
    }

    .report-header > div:last-child {
      border-right: 0;
    }

    .logo-box {
      text-align: center;
      font-weight: 700;
    }

    .header-title {
      text-align: center;
      font-weight: 700;
      line-height: 1.35;
    }

    .header-meta {
      font-size: 13px;
      line-height: 1.5;
    }

    .section-title {
      margin: 14px 0 0;
      padding: 7px 9px;
      border: 1px solid #111;
      text-align: center;
      font-weight: 700;
      background: #f8fafc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #111;
      padding: 7px 8px;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f1f5f9;
      text-align: left;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .plain-list {
      margin: 0;
      padding-left: 18px;
    }

    .bitacora {
      margin-top: 18px;
      border-top: 2px solid #111;
      padding-top: 12px;
    }

    .bitacora-item {
      border: 1px solid #cfd7e3;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #f8fafc;
    }

    .bitacora-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    @media print {
      body {
        background: #fff;
      }

      .toolbar,
      .report-actions {
        display: none !important;
      }

      .app-shell {
        max-width: none;
        padding: 0;
      }

      .report-card {
        border: 0;
        box-shadow: none;
        margin: 0;
        padding: 0;
        page-break-after: always;
      }

      .report {
        border: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="toolbar">
      <div>
        <h1>Prueba de Reportes de Descriptor</h1>
        <p class="subtitle">Consulta datos desde la base y renderiza ejemplo corto, extenso y bitácora.</p>
        <div id="status" class="status">Esperando consulta...</div>
      </div>
      <div>
        <button type="button" onclick="cargarReportes()">Cargar reportes demo</button>
        <button type="button" class="secondary" onclick="window.print()">Imprimir todo</button>
      </div>
    </div>

    <div id="reports"></div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3000';
    const EMPRESA = 1;
    const DESCRIPTORES_DEMO = [1001, 1002];

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleDateString('es-SV');
    }

    function list(items, mapFn) {
      if (!items || items.length === 0) return '<span class="empty">Sin información registrada</span>';
      return `<ul class="plain-list">${items.map((item) => `<li>${mapFn(item)}</li>`).join('')}</ul>`;
    }

    function rows(items, columns) {
      if (!items || items.length === 0) {
        return `<tr><td colspan="${columns.length}" class="empty">Sin información registrada</td></tr>`;
      }
      return items.map((item) => {
        return `<tr>${columns.map((column) => `<td>${column.render(item)}</td>`).join('')}</tr>`;
      }).join('');
    }

    function filtrarFunciones(descriptor, tipo) {
      return (descriptor.FUNCIONES || []).filter((funcion) => funcion.TIPO_FUNCION === tipo);
    }

    function renderHeader(descriptor) {
      return `
        <div class="report-header">
          <div class="logo-box">LOGO<br>INSTITUCIONAL</div>
          <div class="header-title">
            DEPARTAMENTO DE TALENTO HUMANO<br>
            DESCRIPTOR Y PERFIL DE PUESTO<br>
            <span>${escapeHtml(descriptor.FORMATO)}</span>
          </div>
          <div class="header-meta">
            <strong>Código:</strong> DES-${escapeHtml(descriptor.CORR_DESCRIPTOR_PUESTO)}<br>
            <strong>Versión:</strong> ${escapeHtml(descriptor.VERSION)}<br>
            <strong>Fecha emisión:</strong> ${formatDate(descriptor.FECHA_EMISION)}<br>
            <strong>Estado:</strong> ${escapeHtml(descriptor.ESTADO)}
          </div>
        </div>
      `;
    }

    function renderGeneralidades(descriptor) {
      return `
        <div class="section-title">I. GENERALIDADES DEL PUESTO</div>
        <table>
          <tr>
            <th>Unidad organizativa</th>
            <td>${escapeHtml(descriptor.NOMBRE_UNIDAD)}</td>
            <th>Puesto</th>
            <td>${escapeHtml(descriptor.NOMBRE_PUESTO)}</td>
          </tr>
          <tr>
            <th>Reporta a</th>
            <td>${escapeHtml(descriptor.PUESTO_REPORTA)}</td>
            <th>Personal a cargo</th>
            <td>${escapeHtml(descriptor.NUM_PERSONAL_CARGO)}</td>
          </tr>
        </table>
        <div class="section-title">II. OBJETIVO DEL PUESTO</div>
        <table>
          <tr><td>${escapeHtml(descriptor.OBJETIVO_PUESTO)}</td></tr>
        </table>
      `;
    }

    function renderFuncionesCorto(descriptor) {
      const claves = filtrarFunciones(descriptor, 'Clave');
      const secundarias = filtrarFunciones(descriptor, 'Secundaria');
      return `
        <div class="section-title">III. FUNCIONES CLAVES</div>
        <table>
          ${rows(claves, [{ render: (item) => escapeHtml(item.NOMBRE_FUNCION) }])}
        </table>
        <div class="section-title">IV. FUNCIONES SECUNDARIAS</div>
        <table>
          ${rows(secundarias, [{ render: (item) => escapeHtml(item.NOMBRE_FUNCION) }])}
        </table>
        <div class="section-title">V. INDICADORES DE DESEMPEÑO</div>
        <table>
          <thead><tr><th>Indicador</th><th>Frecuencia</th><th>Meta</th></tr></thead>
          <tbody>
            ${rows(descriptor.KPIS, [
              { render: (item) => escapeHtml(item.INDICADOR) },
              { render: (item) => escapeHtml(item.NOMBRE_FRECUENCIA) },
              { render: (item) => `${escapeHtml(item.META)}%` }
            ])}
          </tbody>
        </table>
      `;
    }

    function renderFuncionesExtenso(descriptor) {
      const claves = filtrarFunciones(descriptor, 'Clave');
      return `
        <div class="section-title">III. FUNCIONES CLAVES Y ACTIVIDADES</div>
        <table>
          <thead><tr><th>Función clave</th><th>Actividades</th></tr></thead>
          <tbody>
            ${rows(claves, [
              { render: (item) => escapeHtml(item.NOMBRE_FUNCION) },
              { render: (item) => list(item.ACTIVIDADES, (actividad) => escapeHtml(actividad.NOMBRE_ACTIVIDAD)) }
            ])}
          </tbody>
        </table>
      `;
    }

    function renderPerfil(descriptor) {
      const perfil = descriptor.PERFIL || {};
      return `
        <div class="section-title">PERFIL DEL PUESTO</div>
        <table>
          <tr>
            <th>Edad mínima</th>
            <td>${escapeHtml(perfil.EDAD_MINIMA)}</td>
            <th>Edad máxima</th>
            <td>${escapeHtml(perfil.EDAD_MAXIMA)}</td>
          </tr>
          <tr>
            <th>Sexo</th>
            <td>${escapeHtml(perfil.SEXO)}</td>
            <th>Estado familiar</th>
            <td>${escapeHtml(perfil.ESTADO_FAMILIAR)}</td>
          </tr>
          <tr>
            <th>Disponibilidad</th>
            <td>${escapeHtml(perfil.NOMBRE_DISPONIBILIDAD_HORARIO)}</td>
            <th>Modalidad</th>
            <td>${escapeHtml(perfil.NOMBRE_TIPO_MODALIDAD)}</td>
          </tr>
        </table>
        <div class="two-col">
          <div>
            <div class="section-title">EDUCACIÓN</div>
            <table>
              <thead><tr><th>Requisito</th><th>Especificaciones</th><th>Requerido</th></tr></thead>
              <tbody>
                ${rows(perfil.EDUCACION, [
                  { render: (item) => escapeHtml(item.REQUISITO) },
                  { render: (item) => escapeHtml(item.ESPECIFICACIONES) },
                  { render: (item) => item.REQUERIDO ? 'Sí' : 'No' }
                ])}
              </tbody>
            </table>
          </div>
          <div>
            <div class="section-title">EXPERIENCIA</div>
            <table>
              <thead><tr><th>Requisito</th><th>Requerido</th></tr></thead>
              <tbody>
                ${rows(perfil.EXPERIENCIA, [
                  { render: (item) => escapeHtml(item.REQUISITO) },
                  { render: (item) => item.REQUERIDO ? 'Sí' : 'No' }
                ])}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderCompetencias(descriptor) {
      const perfil = descriptor.PERFIL || {};
      return `
        <div class="two-col">
          <div>
            <div class="section-title">COMPETENCIAS TÉCNICAS</div>
            <table>
              <thead><tr><th>Competencia</th><th>Nivel</th></tr></thead>
              <tbody>
                ${rows(perfil.COMPETENCIAS_TECNICAS, [
                  { render: (item) => escapeHtml(item.NOMBRE_COMPETENCIAS_TECNICAS) },
                  { render: (item) => escapeHtml(item.NIVEL_DOMINIO) }
                ])}
              </tbody>
            </table>
          </div>
          <div>
            <div class="section-title">COMPETENCIAS CONDUCTUALES</div>
            <table>
              <thead><tr><th>Competencia</th><th>Descripción</th></tr></thead>
              <tbody>
                ${rows(perfil.COMPETENCIAS_CONDUCTUALES, [
                  { render: (item) => escapeHtml(item.NOMBRE_COMPETENCIAS_CONDUCTUALES) },
                  { render: (item) => descriptor.FORMATO === 'EXTENSO' ? escapeHtml(item.DESCRIPCION) : 'Listado' }
                ])}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderExtensoExtra(descriptor) {
      if (descriptor.FORMATO !== 'EXTENSO') return '';
      const internas = (descriptor.RELACIONES_LABORALES || []).filter((item) => item.TIPO_RELACION === 'I');
      const externas = (descriptor.RELACIONES_LABORALES || []).filter((item) => item.TIPO_RELACION === 'E');
      return `
        <div class="two-col">
          <div>
            <div class="section-title">RELACIONES INTERNAS</div>
            <table>
              ${rows(internas, [{ render: (item) => `<strong>${escapeHtml(item.PUESTO_AREA)}</strong><br>${escapeHtml(item.MOTIVO_RELACION)}` }])}
            </table>
          </div>
          <div>
            <div class="section-title">RELACIONES EXTERNAS</div>
            <table>
              ${rows(externas, [{ render: (item) => `<strong>${escapeHtml(item.PUESTO_AREA)}</strong><br>${escapeHtml(item.MOTIVO_RELACION)}` }])}
            </table>
          </div>
        </div>
        <div class="section-title">RIESGOS FÍSICOS DEL PUESTO</div>
        <table>
          <tr><th>Esfuerzo físico</th><td>${escapeHtml(descriptor.ESFUERZO_FISICO)}</td></tr>
          <tr><th>Condición ambiental</th><td>${escapeHtml(descriptor.CONDICION_AMBIENTAL)}</td></tr>
          <tr><th>Riesgos profesionales</th><td>${list(descriptor.RIESGOS_PROFESIONALES, (item) => escapeHtml(item.NOMBRE_RIESGO_PROFESIONAL))}</td></tr>
        </table>
      `;
    }

    function renderResponsabilidades(descriptor) {
      return `
        <div class="section-title">RESPONSABILIDADES Y ENTRENAMIENTO</div>
        <table>
          <tr><th>Equipo</th><td>${escapeHtml(descriptor.NOMBRE_EQUIPO)}</td></tr>
          <tr><th>Descripción equipo</th><td>${escapeHtml(descriptor.DESCRIPCION_EQUIPO)}</td></tr>
          <tr><th>Fondos</th><td>${escapeHtml(descriptor.RESP_FONDOS)}</td></tr>
          <tr><th>Documentos</th><td>${escapeHtml(descriptor.RESP_DOCUMENTOS)}</td></tr>
          <tr><th>Toma decisiones</th><td>${escapeHtml(descriptor.TOMA_DECISIONES)}</td></tr>
          <tr><th>Personal</th><td>${escapeHtml(descriptor.RESP_PERSONAL)}</td></tr>
          <tr><th>Impacto económico</th><td>${escapeHtml(descriptor.IMPACTO_ECONOMICO)}</td></tr>
          <tr><th>Entrenamiento</th><td>${escapeHtml(descriptor.NOMBRE_ENTRENAMIENTO)} (${escapeHtml(descriptor.SEMANAS_INDUCCION)} semanas)</td></tr>
          <tr><th>Puestos responsables</th><td>${escapeHtml(descriptor.PUESTOS_RESPONSABLES)}</td></tr>
        </table>
        <div class="section-title">REQUERIMIENTOS ORGANIZACIONALES</div>
        <table>
          ${rows(descriptor.REQUERIMIENTOS_ORGANIZACIONALES, [{ render: (item) => escapeHtml(item.DESCRIPCION) }])}
        </table>
      `;
    }

    function renderBitacora(descriptor) {
      const eventos = descriptor.BITACORA || [];
      return `
        <div class="bitacora">
          <h3>Bitácora del Descriptor</h3>
          ${eventos.length === 0 ? '<p class="empty">Sin eventos registrados.</p>' : eventos.map((evento) => `
            <div class="bitacora-item">
              <strong>${escapeHtml(evento.ACCION)}</strong>
              <div><b>Fecha:</b> ${formatDate(evento.FECHA_ACCION)} | <b>Usuario:</b> ${escapeHtml(evento.USUARIO)} | <b>Rol:</b> ${escapeHtml(evento.ROL_USUARIO)}</div>
              <div><b>Estado anterior:</b> ${escapeHtml(evento.ESTADO_ANTERIOR || '-')} | <b>Estado nuevo:</b> ${escapeHtml(evento.ESTADO_NUEVO || '-')}</div>
              ${evento.OBSERVACION ? `<div><b>Observación:</b> ${escapeHtml(evento.OBSERVACION)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderReporte(descriptor) {
      const funciones = descriptor.FORMATO === 'EXTENSO'
        ? renderFuncionesExtenso(descriptor)
        : renderFuncionesCorto(descriptor);

      return `
        <div class="report-card">
          <div class="report-actions">
            <button type="button" onclick="imprimirReporte('report-${descriptor.CORR_DESCRIPTOR_PUESTO}')">Imprimir / Guardar PDF</button>
          </div>
          <div class="report" id="report-${descriptor.CORR_DESCRIPTOR_PUESTO}">
            ${renderHeader(descriptor)}
            ${renderGeneralidades(descriptor)}
            ${funciones}
            ${renderPerfil(descriptor)}
            ${renderCompetencias(descriptor)}
            ${renderExtensoExtra(descriptor)}
            ${renderResponsabilidades(descriptor)}
            ${renderBitacora(descriptor)}
          </div>
        </div>
      `;
    }

    async function fetchDescriptor(id) {
      const response = await fetch(`${API_BASE_URL}/api/descriptores/${id}?empresa=${EMPRESA}`);
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.message || `No se pudo cargar descriptor ${id}`);
      }
      return payload.data;
    }

    async function cargarReportes() {
      const status = document.getElementById('status');
      const reports = document.getElementById('reports');
      status.textContent = 'Consultando base de datos...';
      reports.innerHTML = '';

      try {
        const descriptores = await Promise.all(DESCRIPTORES_DEMO.map(fetchDescriptor));
        reports.innerHTML = descriptores.map(renderReporte).join('');
        status.textContent = 'Reportes cargados correctamente.';
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        reports.innerHTML = `
          <div class="report-card">
            <strong>No se pudieron cargar los reportes.</strong>
            <p>Verificá que el servidor esté levantado, que el archivo .env tenga credenciales correctas y que hayas ejecutado los inserts demo.</p>
          </div>
        `;
      }
    }

    function imprimirReporte(reportId) {
      const report = document.getElementById(reportId);
      if (!report) return;

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <title>Reporte Descriptor</title>
          <style>${document.querySelector('style').innerHTML}</style>
        </head>
        <body>
          <div class="report">${report.innerHTML}</div>
          <script>
            window.onload = function() {
              window.print();
            };
          <\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    cargarReportes();
  </script>
</body>
</html>
