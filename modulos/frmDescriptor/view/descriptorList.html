<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .descriptor-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.3s; cursor: pointer; }
        .descriptor-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-borrador { background: #6c757d; color: white; }
        .status-enviado_jf { background: #0dcaf0; color: #000; }
        .status-observado_jf { background: #ffc107; color: #000; }
        .status-aprobado_jf { background: #20c997; color: white; }
        .status-enviado_th { background: #fd7e14; color: white; }
        .status-observado_th { background: #ffc107; color: #000; }
        .status-aprobado_th { background: #20c997; color: white; }
        .status-firma_jth { background: #0d6efd; color: white; }
        .status-firmado_jth { background: #0d6efd; color: white; }
        .status-firmado_ct { background: #6f42c1; color: white; }
        .status-firmado_ji { background: #6f42c1; color: white; }
        .status-activo { background: #198754; color: white; }
        .status-inactivo { background: #dc3545; color: white; }
        .filtro-busqueda { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .stats-bar { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .stat-item { text-align: center; border-right: 1px solid #dee2e6; }
        .stat-item:last-child { border-right: none; }
        .stat-number { font-size: 24px; font-weight: bold; color: #0d6efd; }
        .stat-label { font-size: 12px; color: #6c757d; }
        .observacion-box { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin-top: 10px; border-radius: 5px; font-size: 12px; }
        .auditoria-item { padding: 10px; border-bottom: 1px solid #dee2e6; }
        .auditoria-item:last-child { border-bottom: none; }
        .auditoria-fecha { font-size: 11px; color: #6c757d; }
        .auditoria-accion { font-weight: bold; }
        .auditoria-usuario { color: #0d6efd; }
        .auditoria-estado { font-size: 11px; padding: 2px 6px; border-radius: 10px; display: inline-block; margin-left: 8px; }
        .descriptor-actions .dropdown-toggle { min-width: 38px; }
        .descriptor-actions .dropdown-menu { width: 220px; min-width: 220px; max-width: 220px; z-index: 5000; }
        .descriptores-table-card { overflow: visible !important; }
        .descriptores-table-card .table-responsive { overflow-x: auto !important; overflow-y: visible !important; }
        .descriptores-table-card .table { min-width: 980px !important; }
        .descriptores-table-card th,
        .descriptores-table-card td { white-space: nowrap !important; word-break: normal !important; }
        .descriptores-table-card .workflow-table-title { min-width: 190px; white-space: normal !important; }
        .descriptores-table-card .status-badge,
        .descriptores-table-card .badge { white-space: nowrap !important; display: inline-flex; align-items: center; gap: 3px; }
        @media (max-width: 768px) {
            .stat-item { border-right: none; margin-bottom: 10px; }
            .filtro-busqueda .btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="stats-bar">
    <div class="row text-center">
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statBorradores">0</div><div class="stat-label">Borradores</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statEnviadosJF">0</div><div class="stat-label">Enviados a JIS</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statObservadosJF">0</div><div class="stat-label">Observados por JIS</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statAprobadosJF">0</div><div class="stat-label">Aprobados por JIS</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statEnviadosTH">0</div><div class="stat-label">Enviados a TH</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statObservadosTH">0</div><div class="stat-label">Observados por TH</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statAprobadosTH">0</div><div class="stat-label">Aprobados por TH</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statFirmasJTH">0</div><div class="stat-label">Pendientes de firmas</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statActivos">0</div><div class="stat-label">Activos</div></div>
        <div class="col-6 col-md-2 stat-item"><div class="stat-number" id="statInactivos">0</div><div class="stat-label">Inactivos</div></div>
    </div>
</div>

<div class="filtro-busqueda">
    <div class="row g-3">
        <div class="col-md-4"><label class="form-label small">Buscar</label><input type="text" class="form-control" id="searchInput" placeholder="Por puesto, código o área..."></div>
        <div class="col-md-3"><label class="form-label small">Estado</label><select class="form-select" id="estadoFilter">
            <option value="">Todos</option>
            <option value="BORRADOR">Borrador</option>
            <option value="ENVIADO_JF">Enviado a JIS</option>
            <option value="OBSERVADO_JF">Observado por JIS</option>
            <option value="ENVIADO_TH">Enviado a TH</option>
            <option value="OBSERVADO_TH">Observado por TH</option>
            <option value="FIRMA_JTH">Pendiente de firmas</option>
            <option value="ACTIVO">Activo</option>
            <option value="INACTIVO">Inactivo</option>
        </select></div>
        <div class="col-md-3"><label class="form-label small">Ordenar por</label><select class="form-select" id="sortBy"><option value="fecha">Fecha (reciente)</option><option value="puesto">Puesto (A-Z)</option><option value="estado">Estado</option></select></div>
        <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" id="btnNuevoDescriptor"><i class="fas fa-plus"></i> Nuevo</button></div>
    </div>
</div>

<div id="descriptoresListContainer"><div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i><p>Cargando...</p></div></div>

<script>
window.initDescriptorList = function() {
    if (window._listInitialized === true) {
        console.log('Lista ya inicializada, omitiendo');
        return;
    }
    window._listInitialized = true;
    console.log('Inicializando lista de descriptores...');
    
    var currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    var allDescriptors = [];
    var currentPage = 1;
    var pageSize = 5;
    
    function cargarDescriptores() {
        if (typeof DescriptorListService !== 'undefined') {
            allDescriptors = DescriptorListService.getByCreador(currentUser.nombre);
            actualizarEstadisticas();
            filtrarYMostrar();
        } else {
            $('#descriptoresListContainer').html('<div class="alert alert-danger">Error al cargar los descriptores</div>');
        }
    }
    
    function actualizarEstadisticas() {
        if (typeof DescriptorListService !== 'undefined') {
            var stats = DescriptorListService.getEstadisticas(currentUser.nombre);
            $('#statTotal').text(stats.total);
            $('#statBorradores').text(stats.borradores);
            $('#statEnviadosJF').text(stats.enviadosJF || 0);
            $('#statObservadosJF').text(stats.observadosJF || 0);
            $('#statAprobadosJF').text(stats.aprobadosJF || 0);
            $('#statEnviadosTH').text(stats.enviadosTH || 0);
            $('#statObservadosTH').text(stats.observadosTH || 0);
            $('#statAprobadosTH').text(stats.aprobadosTH || 0);
            $('#statFirmasJTH').text(stats.firmaJTH || 0);
            $('#statActivos').text(stats.activos);
            $('#statInactivos').text(stats.inactivos || 0);
        }
    }
    
    function filtrarYMostrar(resetPage) {
        if (resetPage) currentPage = 1;
        var filtered = [...allDescriptors];
        var searchTerm = $('#searchInput').val();
        if (searchTerm && typeof DescriptorListService !== 'undefined') {
            filtered = DescriptorListService.search(filtered, searchTerm);
        }
        var estado = $('#estadoFilter').val();
        if (estado && typeof DescriptorListService !== 'undefined') {
            filtered = DescriptorListService.filterByEstado(filtered, estado);
        }
        var sortBy = $('#sortBy').val();
        if (typeof DescriptorListService !== 'undefined') {
            filtered = DescriptorListService.sort(filtered, sortBy);
        }
        mostrarLista(filtered);
    }
    
    function getEstadoTexto(estado) {
        var estados = {
            'BORRADOR': 'Borrador',
            'ENVIADO_JF': 'Enviado a JIS',
            'OBSERVADO_JF': 'Observado por JIS',
            'APROBADO_POR_JF': 'Aprobado por JIS',
            'ENVIADO_TH': 'Enviado a TH',
            'OBSERVADO_TH': 'Observado por TH',
            'APROBADO_TH': 'Aprobado por TH',
            'FIRMA_JTH': 'Pendiente de firmas',
            'FIRMADO_JTH': 'Firmado por JTH',
            'FIRMADO_CT': 'Firmado por Colaborador',
            'FIRMADO_JI': 'Firmado por Jefe Inmediato',
            'ACTIVO': 'Activo',
            'INACTIVO': 'Inactivo'
        };
        return estados[estado] || estado;
    }
    
    function getEstadoClass(estado) {
        var classes = {
            'BORRADOR': 'borrador',
            'ENVIADO_JF': 'enviado_jf',
            'OBSERVADO_JF': 'observado_jf',
            'APROBADO_POR_JF': 'aprobado_jf',
            'ENVIADO_TH': 'enviado_th',
            'OBSERVADO_TH': 'observado_th',
            'APROBADO_TH': 'aprobado_th',
            'FIRMA_JTH': 'firma_jth',
            'FIRMADO_JTH': 'firmado_jth',
            'FIRMADO_CT': 'firmado_ct',
            'FIRMADO_JI': 'firmado_ji',
            'ACTIVO': 'activo',
            'INACTIVO': 'inactivo'
        };
        return classes[estado] || 'borrador';
    }
    
    function getAccionAuditoriaTexto(accion) {
        var acciones = {
            'ENVÍO A JEFE SUPERIOR': 'ENVÍO A JEFE INMEDIATO SUPERIOR',
            'REENVÍO A JEFE SUPERIOR (DESPUÉS DE CORRECCIÓN)': 'REENVÍO A JEFE INMEDIATO SUPERIOR (DESPUÉS DE CORRECCIÓN)',
            'APROBACIÓN POR JEFE SUPERIOR': 'APROBACIÓN POR JEFE INMEDIATO SUPERIOR',
            'OBSERVACIÓN POR JEFE SUPERIOR': 'OBSERVACIÓN POR JEFE INMEDIATO SUPERIOR'
        };
        return acciones[accion] || accion || 'Evento';
    }
    
    function buildAccionesDropdown(d) {
        var html = '<div class="dropdown descriptor-actions">' +
            '<button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-boundary="viewport" data-bs-display="static" aria-expanded="false">' +
            '<i class="fas fa-ellipsis-v"></i></button>' +
            '<ul class="dropdown-menu dropdown-menu-end">';
        html += '<li><button class="dropdown-item btn-ver" data-id="' + d.id + '"><i class="fas fa-eye me-2 text-info"></i>Ver detalle</button></li>';
        html += '<li><button class="dropdown-item btn-auditoria" data-id="' + d.id + '"><i class="fas fa-history me-2 text-secondary"></i>Auditoría</button></li>';

        if (d.estado === 'BORRADOR' || d.estado === 'OBSERVADO_JF' || d.estado === 'OBSERVADO_TH') {
            html += '<li><button class="dropdown-item btn-editar" data-id="' + d.id + '"><i class="fas fa-edit me-2 text-warning"></i>Editar</button></li>';
        }
        if (d.estado === 'BORRADOR') {
            html += '<li><button class="dropdown-item btn-enviar" data-id="' + d.id + '"><i class="fas fa-paper-plane me-2 text-primary"></i>Enviar a JIS</button></li>';
        }
        if (d.estado === 'OBSERVADO_JF') {
            html += '<li><button class="dropdown-item btn-reenviar-jf" data-id="' + d.id + '"><i class="fas fa-paper-plane me-2 text-warning"></i>Reenviar a JIS</button></li>';
        }
        if (d.estado === 'OBSERVADO_TH') {
            html += '<li><button class="dropdown-item btn-enviar-th-directo" data-id="' + d.id + '"><i class="fas fa-paper-plane me-2 text-success"></i>Reenviar a TH</button></li>';
        }
        if (d.estado === 'APROBADO_POR_JF') {
            html += '<li><button class="dropdown-item btn-enviar-th" data-id="' + d.id + '"><i class="fas fa-paper-plane me-2 text-success"></i>Enviar a TH</button></li>';
        }
        var estaEnFirmas = ['FIRMA_JTH', 'FIRMADO_JTH', 'FIRMADO_CT', 'FIRMADO_JI'].indexOf(d.estado) !== -1;
        if (estaEnFirmas) {
            html += '<li><button class="dropdown-item btn-notificar-firma" data-id="' + d.id + '"><i class="fas fa-bell me-2 text-primary"></i>Notificar firmantes</button></li>';
            if (!d.firmaJI) {
                html += '<li><button class="dropdown-item btn-firmar-ji" data-id="' + d.id + '"><i class="fas fa-signature me-2 text-primary"></i>Firmar documento</button></li>';
            }
        }
        if (d.estado === 'ACTIVO') {
            html += '<li><hr class="dropdown-divider"></li>';
            if ((d.tipoFormato || 'CORTA') === 'EXTENSA') {
                html += '<li><button class="dropdown-item btn-version-extensa" data-id="' + d.id + '"><i class="fas fa-file-pdf me-2 text-secondary"></i>Versión Extensa</button></li>';
            } else {
                html += '<li><button class="dropdown-item btn-version-corta" data-id="' + d.id + '"><i class="fas fa-file-pdf me-2 text-success"></i>Versión Corta</button></li>';
            }
            html += '<li><button class="dropdown-item btn-desactivar" data-id="' + d.id + '"><i class="fas fa-ban me-2 text-danger"></i>Desactivar</button></li>';
        }
        if (d.estado === 'INACTIVO') {
            html += '<li><button class="dropdown-item btn-reactivar" data-id="' + d.id + '"><i class="fas fa-sync-alt me-2 text-success"></i>Reactivar</button></li>';
        }
        html += '</ul></div>';
        return html;
    }

    function mostrarLista(descriptores) {
        var container = $('#descriptoresListContainer');
        if (descriptores.length === 0) {
            container.html('<div class="text-center py-5 workflow-table-card"><i class="fas fa-folder-open fa-3x text-muted mb-3"></i><h5>No hay descriptores</h5><button class="btn btn-primary" onclick="window.cargarNuevoDescriptor()"><i class="fas fa-plus"></i> Crear primero</button></div>');
            return;
        }

        var totalPages = Math.max(1, Math.ceil(descriptores.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        var start = (currentPage - 1) * pageSize;
        var pageItems = descriptores.slice(start, start + pageSize);
        var end = Math.min(start + pageSize, descriptores.length);

        var html = '<div class="workflow-table-card descriptores-table-card">' +
            '<div class="table-responsive">' +
            '<table class="table table-hover align-middle">' +
            '<thead><tr>' +
            '<th style="width:70px;">Opciones</th>' +
            '<th>Código</th>' +
            '<th>Puesto</th>' +
            '<th class="col-area">Área</th>' +
            '<th class="col-version">Versión</th>' +
            '<th>Formato</th>' +
            '<th>Estado</th>' +
            '<th class="col-reporta">Reporta a</th>' +
            '<th class="col-fecha">Fecha</th>' +
            '</tr></thead><tbody>';

        for (var i = 0; i < pageItems.length; i++) {
            var d = pageItems[i];
            var fecha = d.fechaEmision || (d.fechaCreacion ? d.fechaCreacion.split('T')[0] : '-');
            var estadoTexto = getEstadoTexto(d.estado);
            var estadoClass = getEstadoClass(d.estado);
            var version = d.version || 1;
            var esExtensa = (d.tipoFormato || 'CORTA') === 'EXTENSA';
            var formatoBadge = esExtensa
                ? '<span class="badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle"><i class="fas fa-file-lines me-1"></i>Extensa</span>'
                : '<span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle"><i class="fas fa-file-alt me-1"></i>Corta</span>';
            html += '<tr>' +
                '<td>' + buildAccionesDropdown(d) + '</td>' +
                '<td><span class="fw-semibold">' + (d.codigo || 'DES-' + d.id) + '</span></td>' +
                '<td class="workflow-table-title">' + (d.puesto || 'Sin título');
            if ((d.estado === 'OBSERVADO_JF' && d.observacionesJF) || (d.estado === 'OBSERVADO_TH' && d.observacionesTH)) {
                html += '<div class="small text-warning mt-1"><i class="fas fa-comment me-1"></i>Con observaciones</div>';
            }
            html += '</td>' +
                '<td class="col-area">' + (d.area || 'N/A') + '</td>' +
                '<td class="col-version"><span class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle"><i class="fas fa-code-branch me-1"></i>Versión ' + version + '</span></td>' +
                '<td>' + formatoBadge + '</td>' +
                '<td><span class="status-badge status-' + estadoClass + '">' + estadoTexto + '</span></td>' +
                '<td class="col-reporta">' + (d.reportaA || 'N/A') + '</td>' +
                '<td class="col-fecha">' + fecha + '</td>' +
                '</tr>';
        }

        html += '</tbody></table></div>';
        html += '<div class="workflow-pagination-footer">' +
            '<div class="workflow-page-size-options">' +
            '<button class="workflow-page-size-btn page-size-btn ' + (pageSize === 5 ? 'active' : '') + '" data-size="5">5</button>' +
            '<button class="workflow-page-size-btn page-size-btn ' + (pageSize === 10 ? 'active' : '') + '" data-size="10">10</button>' +
            '<button class="workflow-page-size-btn page-size-btn ' + (pageSize === 25 ? 'active' : '') + '" data-size="25">25</button>' +
            '</div>' +
            '<div class="small text-muted">Mostrando ' + (start + 1) + ' a ' + end + ' de ' + descriptores.length + ' registros</div>' +
            '<nav><ul class="pagination pagination-sm mb-0">' +
            '<li class="page-item ' + (currentPage === 1 ? 'disabled' : '') + '"><button class="page-link page-link-descriptores" data-page="' + (currentPage - 1) + '"><i class="fas fa-chevron-left"></i></button></li>';
        for (var p = 1; p <= totalPages; p++) {
            html += '<li class="page-item ' + (p === currentPage ? 'active' : '') + '"><button class="page-link page-link-descriptores" data-page="' + p + '">' + p + '</button></li>';
        }
        html += '<li class="page-item ' + (currentPage === totalPages ? 'disabled' : '') + '"><button class="page-link page-link-descriptores" data-page="' + (currentPage + 1) + '"><i class="fas fa-chevron-right"></i></button></li>' +
            '</ul></nav></div></div>';

        container.html(html);

        $('.btn-ver').off('click').on('click', function(e) { e.stopPropagation(); verDescriptor($(this).data('id')); });
        $('.btn-auditoria').off('click').on('click', function(e) { e.stopPropagation(); verAuditoria($(this).data('id')); });
        $('.btn-editar').off('click').on('click', function(e) { e.stopPropagation(); editarDescriptor($(this).data('id')); });
        $('.btn-enviar').off('click').on('click', function(e) { e.stopPropagation(); enviarDescriptor($(this).data('id')); });
        $('.btn-reenviar-jf').off('click').on('click', function(e) { e.stopPropagation(); reenviarDescriptorAJF($(this).data('id')); });
        $('.btn-enviar-th').off('click').on('click', function(e) { e.stopPropagation(); enviarDescriptorATH($(this).data('id')); });
        $('.btn-enviar-th-directo').off('click').on('click', function(e) { e.stopPropagation(); reenviarDescriptorATH($(this).data('id')); });
        $('.btn-notificar-firma').off('click').on('click', function(e) { e.stopPropagation(); notificarFirmantes($(this).data('id')); });
        $('.btn-firmar-ji').off('click').on('click', function(e) { e.stopPropagation(); firmarDescriptorJI($(this).data('id')); });
        $('.btn-desactivar').off('click').on('click', function(e) { e.stopPropagation(); desactivarDescriptor($(this).data('id')); });
        $('.btn-reactivar').off('click').on('click', function(e) { e.stopPropagation(); reactivarDescriptor($(this).data('id')); });
        // Eventos para versión corta y extensa
        $('.btn-version-corta').off('click').on('click', function(e) { 
            e.stopPropagation(); 
            generarVersionCorta($(this).data('id')); 
        });
        $('.btn-version-extensa').off('click').on('click', function(e) { 
            e.stopPropagation(); 
            generarVersionExtensa($(this).data('id'));
            //Swal.fire('En desarrollo', 'Versión extensa próximamente disponible', 'info'); 
        });
        $('.page-link-descriptores').off('click').on('click', function(e) {
            e.preventDefault();
            var page = parseInt($(this).data('page'), 10);
            if (!isNaN(page) && page >= 1 && page <= totalPages) {
                currentPage = page;
                filtrarYMostrar(false);
            }
        });
        $('.page-size-btn').off('click').on('click', function(e) {
            e.preventDefault();
            pageSize = parseInt($(this).data('size'), 10);
            currentPage = 1;
            filtrarYMostrar(false);
        });
        $('.descriptor-actions .dropdown-toggle').off('shown.bs.dropdown.descriptorMenu').on('shown.bs.dropdown.descriptorMenu', function() {
            var buttonRect = this.getBoundingClientRect();
            var menu = $(this).siblings('.dropdown-menu')[0];
            if (!menu) return;
            menu.style.position = 'fixed';
            menu.style.width = '220px';
            menu.style.minWidth = '220px';
            menu.style.maxWidth = '220px';
            menu.style.top = (buttonRect.bottom + 4) + 'px';
            menu.style.left = Math.max(8, Math.min(buttonRect.left, window.innerWidth - 228)) + 'px';
            menu.style.zIndex = '5000';
        });
        $('.descriptor-actions .dropdown-toggle').off('hidden.bs.dropdown.descriptorMenu').on('hidden.bs.dropdown.descriptorMenu', function() {
            var menu = $(this).siblings('.dropdown-menu')[0];
            if (!menu) return;
            menu.style.position = '';
            menu.style.width = '';
            menu.style.minWidth = '';
            menu.style.maxWidth = '';
            menu.style.top = '';
            menu.style.left = '';
            menu.style.zIndex = '';
        });
    }
    
    function getEstadoBadgeClass(estado) {
        var classes = {
            'BORRADOR': 'bg-secondary',
            'ENVIADO_JF': 'bg-info',
            'OBSERVADO_JF': 'bg-warning',
            'APROBADO_POR_JF': 'bg-success',
            'ENVIADO_TH': 'bg-primary',

    function verAuditoria(id) {
        if (typeof DescriptorService === 'undefined') return;
        var descriptor = DescriptorService.getById(id);
        if (!descriptor) return;
        
        var auditoria = descriptor.auditoria || { eventos: [] };
        var eventos = auditoria.eventos || [];
        
        eventos.sort(function(a, b) { return new Date(a.fecha) - new Date(b.fecha); });
        
        var html = '<div class="text-start" style="max-height: 500px; overflow-y: auto;">';
        html += '<div class="alert alert-info mb-3"><strong>Descriptor:</strong> ' + descriptor.codigo + '<br><strong>Puesto:</strong> ' + descriptor.puesto + '<br><strong>Estado actual:</strong> <span class="badge ' + getEstadoBadgeClass(descriptor.estado) + '">' + getEstadoTexto(descriptor.estado) + '</span></div>';
        html += '<h6 class="border-bottom pb-2">Línea de tiempo del proceso</h6>';
        
        if (eventos.length === 0) {
            html += '<p class="text-muted text-center">No hay eventos registrados</p>';
        } else {
            for (var i = 0; i < eventos.length; i++) {
                var ev = eventos[i];
                var fechaFormateada = new Date(ev.fecha).toLocaleString();
                var estadoBadge = '';
                if (ev.estadoNuevo) {
                    estadoBadge = ' <span class="badge ' + getEstadoBadgeClass(ev.estadoNuevo) + '">' + getEstadoTexto(ev.estadoNuevo) + '</span>';
                }
                
                html += '<div class="auditoria-item">' +
                    '<div class="auditoria-fecha"><i class="far fa-calendar-alt me-1"></i> ' + fechaFormateada + '</div>' +
                    '<div class="auditoria-accion">' + getAccionAuditoriaTexto(ev.accion) + estadoBadge + '</div>' +
                    '<div class="auditoria-usuario"><i class="fas fa-user me-1"></i> ' + (ev.usuario || 'Sistema') + ' - ' + (ev.rol || '') + '</div>';
                
                if (ev.observacion) {
                    html += '<div class="alert alert-warning mt-2 mb-0 p-2 small"><i class="fas fa-comment"></i> <strong>Observación:</strong> ' + ev.observacion + '</div>';
                }
                
                html += '</div>';
            }
        }
        
        html += '<hr><h6 class="border-bottom pb-2">Resumen de Firmas</h6>';
        
        var firmas = [
            { nombre: 'Jefe de Talento Humano', estado: descriptor.firmaJTH ? 'Firmado' : 'Pendiente' },
            { nombre: 'Colaborador/Titular', estado: descriptor.firmaCT ? 'Firmado' : 'Pendiente' },
            { nombre: 'Jefe Inmediato', estado: descriptor.firmaJI ? 'Firmado' : 'Pendiente' }
        ];
        
        for (var f = 0; f < firmas.length; f++) {
            var icono = firmas[f].estado === 'Firmado' ? '<i class="fas fa-check-circle text-success"></i>' : '<i class="fas fa-clock text-warning"></i>';
            html += '<div class="d-flex justify-content-between align-items-center mb-2">' +
                '<span>' + icono + ' <strong>' + firmas[f].nombre + '</strong></span>' +
                '<span class="text-muted small">' + firmas[f].estado + '</span>' +
                '</div>';
        }
        
        html += '</div>';
        
        Swal.fire({ title: 'Auditoría del Descriptor', html: html, width: '650px', confirmButtonText: 'Cerrar', confirmButtonColor: '#0d6efd' });
    }

    function tieneComplementosTHExtensos(descriptor) {
        if (!descriptor || (descriptor.tipoFormato || 'CORTA') !== 'EXTENSA') return false;
        var relaciones = descriptor.relacionesLaborales || {};
        var riesgos = descriptor.riesgosFisicos || {};
        var tieneRelaciones = (relaciones.internas && relaciones.internas.length > 0) || (relaciones.externas && relaciones.externas.length > 0);
        var tieneRequerimientos = descriptor.requerimientosOrganizacionales && descriptor.requerimientosOrganizacionales.length > 0;
        var tieneRiesgos = (riesgos.esfuerzo && riesgos.esfuerzo.trim()) ||
            (riesgos.condiciones && riesgos.condiciones.trim()) ||
            (riesgos.riesgos && riesgos.riesgos.length > 0);
        return !!(tieneRelaciones || tieneRequerimientos || tieneRiesgos);
    }

            DescriptorController.init(currentUser, id, {

    function firmarDescriptorJI(id) {
        var descriptor = DescriptorService.getById(id);
        if (!descriptor) return;
        
        var modalHtml = '<div class="text-center signature-modal"><p class="mb-2">Firme en el recuadro con el mouse o dedo:</p><div id="signature-pad" class="border rounded mx-auto signature-pad-box" style="width: 400px; height: 200px; background: white; border: 2px solid #ccc;"><canvas id="firmaCanvas" width="400" height="200" style="width:100%;height:100%;"></canvas></div><div class="mt-3 signature-actions"><button id="limpiarFirma" class="btn btn-secondary btn-sm"><i class="fas fa-eraser"></i> Limpiar</button><button id="descargarFirma" class="btn btn-info btn-sm"><i class="fas fa-download"></i> Descargar</button></div></div>';
        
        Swal.fire({
            title: 'Firma Digital - Jefe Inmediato',
            html: modalHtml,
            width: '500px',
            showCancelButton: true,
            confirmButtonText: '<i class="fas fa-save"></i> Guardar Firma',
            cancelButtonText: 'Cancelar',
            didOpen: function() {
                var canvas = document.getElementById('firmaCanvas');
                var signaturePad = new SignaturePad(canvas, {
                    backgroundColor: 'rgb(255,255,255)',
                    penColor: 'rgb(0,0,0)'
                });
                function resizeSignatureCanvas() {
                    var ratio = Math.max(window.devicePixelRatio || 1, 1);
                    var box = canvas.parentElement;
                    canvas.width = box.offsetWidth * ratio;
                    canvas.height = box.offsetHeight * ratio;
                    canvas.getContext('2d').scale(ratio, ratio);
                    signaturePad.clear();
                }
                resizeSignatureCanvas();
                $(window).off('resize.signatureJIList').on('resize.signatureJIList', resizeSignatureCanvas);
                $('#limpiarFirma').click(function() { signaturePad.clear(); });
                $('#descargarFirma').click(function() {
                    if (signaturePad.isEmpty()) { Swal.fire('Advertencia', 'No hay firma', 'warning'); return; }
                    var link = document.createElement('a');
                    link.download = 'firma_ji_' + id + '.png';
                    link.href = signaturePad.toDataURL('image/png');
                    link.click();
                });
                window.currentSignaturePad = signaturePad;
            },
            willClose: function() {
                $(window).off('resize.signatureJIList');
            },
            preConfirm: function() {
                if (window.currentSignaturePad && window.currentSignaturePad.isEmpty()) {
                    Swal.showValidationMessage('Debe dibujar una firma');
                    return false;
                }
                return window.currentSignaturePad.toDataURL('image/png');
            }
        }).then(function(result) {
            if (result.isConfirmed && result.value) {
                var currentUserGlobal = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
                var firmasGuardadas = JSON.parse(localStorage.getItem('firmas')) || {};
                firmasGuardadas['ji_' + id] = result.value;
                localStorage.setItem('firmas', JSON.stringify(firmasGuardadas));
                var descriptorActualizado = DescriptorService.getById(id);
                descriptorActualizado.firmaJI = result.value;
                descriptorActualizado.fechaFirmaJI = new Date().toISOString();
                descriptorActualizado.estado = DescriptorService.getEstadoDespuesDeFirma(descriptorActualizado);
                DescriptorService.update(id, descriptorActualizado);
                DescriptorService.registrarEvento(id, {
                    accion: 'FIRMA DEL JEFE INMEDIATO',
                    usuario: currentUserGlobal.nombre,
                    rol: currentUserGlobal.rolNombre,
                    estadoNuevo: 'FIRMADO_JI',
                    estado: descriptorActualizado.estado
                });
                var mensaje = descriptorActualizado.estado === 'ACTIVO' ? 'Descriptor firmado y activado correctamente' : 'Descriptor firmado exitosamente. Aún quedan firmas pendientes.';
                Swal.fire('Firmado', mensaje, 'success');
                cargarDescriptores();
            }
        });
    }

    function reactivarDescriptor(id) {
        var descriptor = DescriptorService.getById(id);
        if (!descriptor) return;
        
        var descriptorVigente = DescriptorService.getDescriptorVigenteOEnProcesoByPuesto(descriptor.puesto, descriptor.id);
        if (descriptorVigente) {
            var detalleVersion = descriptorVigente.version ? ' versión <strong>' + descriptorVigente.version + '</strong>' : '';
            var mensaje = descriptorVigente.estado === 'ACTIVO'
                ? 'No es posible reactivar este descriptor porque ya existe una versión activa para el puesto <strong>' + descriptor.puesto + '</strong>' + detalleVersion + '.<br><br>Primero debe desactivar esa versión activa antes de reactivar otra versión del mismo puesto.'
                : 'No es posible reactivar este descriptor porque ya existe otra versión del puesto <strong>' + descriptor.puesto + '</strong>' + detalleVersion + ' que se encuentra en proceso de aprobación.<br><br>La versión en proceso deberá completar su ciclo de vida y ser desactivada antes de permitir la reactivación de otra versión.';
            
            Swal.fire({
                icon: 'warning',
                title: 'No se puede reactivar',
                html: mensaje,
                confirmButtonText: 'Entendido',
                confirmButtonColor: '#0d6efd'
            });
            return;
        }
        
        Swal.fire({
            title: 'Reactivar Descriptor',
            text: '¿Está seguro de que desea reactivar este descriptor? Volverá a estado ACTIVO.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, reactivar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#198754'
        }).then(function(result) {
            if (result.isConfirmed) {
                var currentUserGlobal = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
                DescriptorService.reactivar(id, currentUserGlobal.nombre, currentUserGlobal.rolNombre);
                Swal.fire('Reactivado', 'Descriptor reactivado como activo correctamente', 'success');
                cargarDescriptores();
            }
        });
    }

};
