<div class="fade-in areas-puestos-page">
    <style>
        .catalog-card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 10px 30px rgba(15,23,42,.08); padding:18px; margin-bottom:18px; }
        .catalog-card h5 { font-weight:700; color:#0f172a; }
        .catalog-table-card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; }
        .catalog-table-card .table { margin-bottom:0; white-space:nowrap; }
        body.dark-mode .catalog-card, body.dark-mode .catalog-table-card { background:#1f2937; border-color:#374151; color:#e5e7eb; box-shadow:0 14px 30px rgba(0,0,0,.22); }
        body.dark-mode .catalog-card h5 { color:#f9fafb; }
        body.dark-mode .catalog-card .form-control, body.dark-mode .catalog-card .form-select { background-color:#111827; border-color:#4b5563; color:#f9fafb; }
        body.dark-mode .catalog-table-card .table { --bs-table-bg:#1f2937; --bs-table-color:#e5e7eb; --bs-table-border-color:#374151; --bs-table-hover-bg:#263244; --bs-table-hover-color:#f9fafb; }
        body.dark-mode .catalog-table-card .table-light { --bs-table-bg:#111827; --bs-table-color:#f9fafb; }
        body.dark-mode .catalog-table-card .table-hover tbody tr:hover,
        body.dark-mode .catalog-table-card .table-hover tbody tr:hover td,
        body.dark-mode .catalog-table-card .table-hover tbody tr:hover th,
        body.dark-mode .catalog-table-card .table-hover tbody tr:hover strong,
        body.dark-mode .catalog-table-card .table-hover tbody tr:hover small { color:#f9fafb !important; }
    </style>

    <div id="jefesListPanel">
    <div class="catalog-card">
        <h5><i class="fas fa-user-tie me-2 text-primary"></i>Formulario para crear Jefe Inmediato</h5>
        <p class="text-muted small">Cree usuarios responsables para asignarlos a un área.</p>
        <form id="formJefeInmediato">
            <div class="row g-3">
                <div class="col-md-3"><label class="form-label">Usuario</label><input type="text" class="form-control" name="usuario" placeholder="ej. maria.garcia" required></div>
                <div class="col-md-3"><label class="form-label">Nombre completo</label><input type="text" class="form-control" name="nombre" placeholder="Ing. María García" required></div>
                <div class="col-md-3"><label class="form-label">Contraseña</label><input type="text" class="form-control" name="password" value="123456" required></div>
                <div class="col-md-3"><label class="form-label">Área que supervisará</label><select class="form-select area-select" name="area" required></select></div>
            </div>
            <button type="submit" class="btn btn-primary mt-3"><i class="fas fa-save me-1"></i> Crear usuario</button>
        </form>
    </div>

    <div class="catalog-table-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light"><tr><th>Jefe inmediato</th><th>Área asignada</th><th>Puestos del área</th></tr></thead>
                <tbody id="jefesTableBody"></tbody>
            </table>
        </div>
    </div>
    </div>

    <div id="puestosAreaPanel" class="d-none">
        <div class="catalog-card">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <div>
                    <h5 class="mb-1"><i class="fas fa-briefcase me-2 text-info"></i><span id="puestosAreaTitle">Puestos del área</span></h5>
                    <p class="text-muted small mb-1">Puestos vinculados al área del jefe inmediato seleccionado.</p>
                    <div id="puestosAreaContext" class="small text-info"></div>
                </div>
                <button type="button" class="btn btn-outline-secondary" id="btnVolverAreas"><i class="fas fa-arrow-left me-1"></i>Volver a jefes</button>
            </div>
            <form id="formPuesto">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">Área</label><select class="form-select area-select" name="areaPuesto" required></select></div>
                    <div class="col-md-4"><label class="form-label">Título del puesto</label><input type="text" class="form-control" name="nombrePuesto" placeholder="Ej. Auxiliar de Biblioteca" required></div>
                    <div class="col-md-4"><label class="form-label">Reporta a</label><input type="text" class="form-control" name="reportaA" placeholder="Nombre del responsable"></div>
                </div>
                <button type="submit" class="btn btn-info text-white mt-3"><i class="fas fa-plus me-1"></i> Crear puesto</button>
            </form>
        </div>
        <div class="catalog-table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light"><tr><th>Puesto</th><th>Reporta a</th><th>Estado</th><th>Aprobación</th><th>Acciones</th></tr></thead>
                    <tbody id="puestosAreaTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
